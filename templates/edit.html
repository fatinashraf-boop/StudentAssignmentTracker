
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Assignment</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Edit Assignment</h1>
        <p>Update your assignment details.</p>
    </header>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <section class="panel">
            <form action="{{ url_for('edit_assignment', assignment_id=assignment['id']) }}"
                  method="POST">
                <label for="title">Assignment Title</label>
                <input type="text" id="title" name="title"
                       value="{{ assignment['title'] }}"
                       maxlength="150" required>

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject"
                       value="{{ assignment['subject'] }}"
                       maxlength="100" required>

                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date"
                       value="{{ assignment['due_date'] }}" required>

                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="Pending"
                        {% if assignment['status'] == 'Pending' %}selected{% endif %}>
                        Pending
                    </option>
                    <option value="Completed"
                        {% if assignment['status'] == 'Completed' %}selected{% endif %}>
                        Completed
                    </option>
                </select>

                <button type="submit">Save Changes</button>
                <a class="cancel-link" href="{{ url_for('home') }}">Cancel</a>
            </form>
        </section>
    </main>
</body>
</html>
